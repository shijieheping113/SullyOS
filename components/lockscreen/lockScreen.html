<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><filter id="clockShadowFilter" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    <feOffset dy="10"/>
    <feComposite in2="SourceAlpha" operator="out"/>
  </filter></defs>
</svg>
<section class="phone" id="phone" aria-label="锁屏">
    <div class="wallpaper" id="lockWallpaper"></div>
    <div class="wake-wallpaper" id="wakeWallpaper" hidden aria-hidden="true"></div>
    <div class="shade"></div>
    <div class="features" id="clockLayer">
      <div class="clock" id="clock">
        <div class="date"><span id="date">11月14日 周六</span><span id="lockWeather" hidden><span id="lockWeatherText"></span><span id="lockWeatherIcon" aria-hidden="true" hidden></span></span></div>
        <time class="time" id="time"><span id="clockDigits">23:13</span><span class="clock-glass-shadow" aria-hidden="true"></span><span class="glass clock-glass-face" aria-hidden="true"><span class="clock-ink"></span></span></time>
        <div class="clock-details">
          <span id="bottomText">留一盏灯，等你回来。</span>
          <span id="companionRing" role="meter" aria-valuemin="0" aria-valuemax="100" aria-label="今天剩余时间">
            <span class="glass ring-glass-face" aria-hidden="true"></span>
            <svg class="battery-ring" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.6" aria-hidden="true">
              <circle cx="24" cy="24" r="20" opacity=".26"/>
              <circle id="companionArc" cx="24" cy="24" r="20" pathLength="100" stroke-dasharray="0 100" stroke-linecap="round"/>
            </svg>
            <svg class="ring-symbol" viewBox="0 0 24 24" aria-hidden="true">
              <g id="companionSun" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4m0-13.4-1.4 1.4M6.7 17.3l-1.4 1.4"/>
              </g>
              <path id="companionMoon" style="display:none" fill="currentColor" transform="translate(1.43 -1.43)" d="M18.36 18.36A9 9 0 1 1 5.64 5.64Q5.64 18.36 18.36 18.36Z"/>
              <path id="companionMusic" style="display:none" fill="currentColor" d="M10 4l9-2v13a3 3 0 1 1-2-2.83V6l-5 1v11a3.5 3.5 0 1 1-2-3.16Z"/>
            </svg>
          </span>
          <span id="batteryDetails" role="meter" aria-label="设备电量" aria-valuemin="0" aria-valuemax="100" aria-valuetext="暂不可用">
            <span class="glass ring-glass-face" aria-hidden="true"></span>
            <svg class="battery-ring" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.6" aria-hidden="true">
              <circle cx="24" cy="24" r="20" opacity=".26"/>
              <circle id="batteryArc" cx="24" cy="24" r="20" pathLength="100" stroke-dasharray="0 100" stroke-linecap="round"/>
            </svg>
            <span class="battery-phone" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </div>
    <div class="art front" id="frontArt" hidden></div>
    <div class="features" id="lockControls">

      <button type="button" class="notice glass" id="notice" hidden>
        <span class="notice-avatar"><span id="noticeInitial" aria-hidden="true"></span><img id="noticeAvatar" alt="" hidden></span>
        <span class="notice-body"><strong id="noticeName"></strong><small id="noticeText"></small></span>
        <span class="notice-meta"><span class="notice-stamp" id="noticeStamp"></span><span id="noticeCount" hidden></span></span>
      </button>
      <div id="noticeStack" aria-hidden="true" hidden><i></i><i></i></div>
      <section class="player glass" id="player" aria-label="锁屏播放器" hidden>
        <div class="player-heading">
          <div class="cover" id="cover" aria-hidden="true"></div>
          <div class="track"><strong id="trackTitle"><span id="trackTitleText"></span></strong><span id="playerLyric"></span></div>
          <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="scrub"><span id="elapsed">0:00</span><label class="scrub-target"><span class="scrub-line"><i id="played"></i></span><input type="range" id="playerSeek" min="0" max="1000" value="0" aria-label="播放进度"></label><span id="remaining">−0:00</span></div>
        <div class="player-controls">
          <span class="dim" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 3 6.1 6.8 1-4.9 4.8 1.2 6.8-6.1-3.2L5.9 21l1.2-6.9-4.9-4.8 6.8-1z"/></svg></span>
          <button type="button" id="playerPrev" aria-label="上一首"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 5a1 1 0 0 1 1 1v12a1 1 0 0 1-1.5.9L12 13.6V18a1 1 0 0 1-1.5.9l-9-6a1 1 0 0 1 0-1.8l9-6A1 1 0 0 1 12 6v4.4l8.5-5.3z"/></svg></button>
          <button class="main-control" type="button" id="playerToggle" aria-label="播放"><svg viewBox="0 0 24 24"><path id="playShape" d="M6 3.7c0-1 1.1-1.6 2-1.1l13 8.3a1.3 1.3 0 0 1 0 2.2L8 21.4c-.9.5-2-.1-2-1.1z"/></svg></button>
          <button type="button" id="playerNext" aria-label="下一首"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5a1 1 0 0 0-1 1v12a1 1 0 0 0 1.5.9l8.5-5.3V18a1 1 0 0 0 1.5.9l9-6a1 1 0 0 0 0-1.8l-9-6A1 1 0 0 0 12 6v4.4L3.5 5.1z"/></svg></button>
          <span class="dim" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" style="fill:none"><path d="M4 17a10 10 0 1 1 16 0M7 15a6 6 0 1 1 10 0M10 13a2.7 2.7 0 1 1 4 0"/><path fill="currentColor" stroke="none" d="m12 13 6 7H6z"/></svg></span>
        </div>
      </section>
      <div class="shortcuts">
        <button type="button" class="shortcut glass" id="lockChat" aria-label="长按选择最近私聊，再上滑解锁" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 4.5h16A2.5 2.5 0 0 1 22.5 7v9a2.5 2.5 0 0 1-2.5 2.5H9L3.5 22V18.5A2.5 2.5 0 0 1 1.5 16V7A2.5 2.5 0 0 1 4 4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 11.5h.03m4.95 0h.03m4.95 0H17" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/></svg></button>
        <span class="shortcut glass" id="lockCamera" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="m8 6 1.6-2h4.8L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.8" fill="var(--shortcut-detail,#463e44)" opacity=".62"/><circle cx="12" cy="13" r="2.45" opacity=".82"/></svg></span>
      </div>
    </div>
    <div class="topline" aria-hidden="true">
      <span id="statusTime" style="visibility:hidden">23:13</span>
      <span class="signal"><svg viewBox="0 0 20 16" fill="currentColor"><rect x="1" y="10" width="3" height="4" rx="1"/><rect x="6" y="7" width="3" height="7" rx="1"/><rect x="11" y="4" width="3" height="10" rx="1"/><rect x="16" y="1" width="3" height="13" rx="1"/></svg><svg viewBox="0 0 24 15" fill="none" stroke="currentColor"><rect x="1" y="2" width="19" height="11" rx="3"/><path d="M22 6v3" stroke-width="2"/><rect x="3" y="4" width="14" height="7" fill="currentColor" rx="1"/></svg></span>
    </div>
    <div class="pill" aria-hidden="true"><svg id="lockMark" viewBox="0 0 16 16" fill="none" stroke="white" stroke-linecap="round"><path d="M5 7V5a3 3 0 1 1 6 0v2" stroke-width="1.4"/><rect x="3.5" y="7" width="9" height="6" rx="1.5" fill="white"/></svg></div>
    <div class="light-wash" id="lightWash" aria-hidden="true"></div>
    <button class="unlock-zone" type="button" id="unlockZone" aria-label="从这里向上滑解锁。键盘按上箭头或回车。"><span class="lock-chat-hint" id="lockChatHint" hidden>上滑解锁去聊天</span><span class="handle" id="handle"></span></button>
  </section>
