    var z=this.zoom||1,s=a.width/z/390,dx=(a.left+a.width/2-b.left)/z-195,dy=(a.top+a.height/2-b.top)/z-400;

  };

  Panel.prototype.open=function(key,target){
    var self=this;if(this.current&&this.current.getAttribute('data-app')===key&&this.desired)return;
    var reopening=this.current&&this.current.getAttribute('data-app')===key&&!this.desired;
    this.version++;this.desired=true;
    if(reopening){this.time(this.current,this.mode==='icon'?400:560);this.current.querySelectorAll('button').forEach(function(b){b.tabIndex=0;});this.atRest(this.current);this.setDesktop(true);return;}

    var app=apps[key],w=document.createElement('div');w.className='window';w.setAttribute('data-app',key);w.style.background=app.color;w.style.setProperty('--app-color',app.color);w.style.setProperty('--app-accent',app.accent);

    else if(this.mode==='icon'){w.style.transform=this.origin.transform;w.style.clipPath=this.origin.clip;w.style.opacity='0';w.classList.add('source-hidden');}
    else{w.style.transform='translate(0px,12px) scale(.94)';w.style.clipPath='inset(0px 0px round 28px)';w.style.opacity='0';}

  };
  Panel.prototype.close=function(){
    if(!this.current||!this.desired)return;var self=this,w=this.current,v=++this.version;this.desired=false;
    var key=w.getAttribute('data-app');this.time(w,this.mode==='icon'?300:440);w.classList.remove('active');w.setAttribute('aria-hidden','true');w.querySelectorAll('button').forEach(function(b){b.tabIndex=-1;});

    this.setDesktop(false);var timer=setTimeout(function(){if(self.version===v&&!self.desired){w.remove();self.current=null;self.windows=self.windows.filter(function(n){return n!==w;});}},this.duration(this.mode==='icon'?300:440)+80);this.timers.push(timer);

  };
  Panel.prototype.reset=function(){this.version++;this.timers.forEach(clearTimeout);this.timers=[];this.windows.forEach(function(w){w.remove();});this.windows=[];this.current=null;this.desired=false;this.setDesktop(false);this.section.querySelector('.live-caption').textContent='先点一个应用，感受打开与收回。';};
  document.querySelectorAll('.sample').forEach(function(s){sessions.push(new Panel(s));});
  window.addEventListener('resize',function(){sessions.forEach(function(p){p.resize();});});
  if(window.ResizeObserver){var observer=new ResizeObserver(function(){sessions.forEach(function(p){p.resize();});});document.querySelectorAll('.screen').forEach(function(s){observer.observe(s);});}
  document.querySelectorAll('[data-mode][role=tab]').forEach(function(tab){tab.addEventListener('click',function(){cancelDemo();var mode=tab.getAttribute('data-mode');document.querySelectorAll('[data-mode][role=tab]').forEach(function(t){t.setAttribute('aria-selected',t===tab?'true':'false');});document.querySelectorAll('.sample').forEach(function(s){s.classList.toggle('mobile-hidden',s.getAttribute('data-mode')!==mode);});sessions.forEach(function(p){p.resize();});});});
  document.getElementById('slow').addEventListener('click',function(){cancelDemo();slow=!slow;this.setAttribute('aria-pressed',slow?'true':'false');sessions.forEach(function(p){if(p.current)p.time(p.current,slow?400:280);});});
  document.getElementById('reset').addEventListener('click',function(){cancelDemo();sessions.forEach(function(p){p.reset();});});
  document.getElementById('demo').addEventListener('click',function(){cancelDemo();sessions.forEach(function(p){p.reset();});if(reduced.matches){sessions.forEach(function(p){p.open('link');});return;}this.textContent='演示中…';var unit=slow?3:1;function later(ms,fn){autoTimers.push(setTimeout(fn,ms*unit));}later(100,function(){sessions.forEach(function(p){p.open('link');});});later(1350,function(){sessions.forEach(function(p){p.close();});});later(2300,function(){sessions.forEach(function(p){p.open('palace');});});later(3500,function(){sessions.forEach(function(p){p.open('settings');});});later(4700,function(){sessions.forEach(function(p){p.close();});});later(5300,function(){cancelDemo();});});
  document.addEventListener('visibilitychange',function(){if(document.hidden)cancelDemo();});
  function motionChanged(){cancelDemo();sessions.forEach(function(p){p.reset();});}
  if(reduced.addEventListener)reduced.addEventListener('change',motionChanged);else if(reduced.addListener)reduced.addListener(motionChanged);
  window.motionPreview={sessions:sessions,reset:function(){cancelDemo();sessions.forEach(function(p){p.reset();});}};
})();
