<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>卡片外观预览</title>
<style>
:root{--lavender:#d8c5ff;--violet:#7652ae;--violet-deep:#51377f;--ink:#42345c;--soft:#8e7ba9;--white:rgba(255,255,255,.82);--line:rgba(118,82,174,.2);--pink:#e7afd9;--gold:#f1d28f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4efff;color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}body{padding:20px 16px 34px}.page{max-width:520px;margin:0 auto}.intro{margin:0 2px 18px}.intro h1{margin:0;color:var(--violet-deep);font-family:ui-serif,"Songti SC",serif;font-size:25px;font-weight:650}.intro p{margin:7px 0 0;color:#8a78a6;font-size:12px;line-height:1.7}.switcher{display:flex;gap:7px;margin-bottom:17px}.switcher button{min-height:36px;border:1px solid var(--line);border-radius:999px;padding:0 13px;background:rgba(255,255,255,.62);color:#806a9e;font-size:12px}.switcher button.active{background:var(--violet);color:#fff;border-color:var(--violet);box-shadow:0 5px 14px rgba(118,82,174,.28)}.board{display:grid;gap:15px}.card{position:relative;overflow:hidden;padding:22px 21px 19px;border:1px solid rgba(255,255,255,.95);border-radius:27px;background:rgba(255,255,255,.62);box-shadow:0 14px 30px rgba(134,101,191,.17),inset 0 1px 2px rgba(255,255,255,.95)}.card:before{content:"";position:absolute;inset:-40px auto auto -35px;width:170px;height:120px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(7px)}.card:after{content:"✦";position:absolute;right:21px;top:18px;color:rgba(255,255,255,.9);font-size:18px;text-shadow:0 0 9px rgba(255,255,255,.95)}.card{isolation:isolate}.card .card-head,.card .copy,.card .actions,.card .status{z-index:1}.card .status{display:flex;align-items:center;gap:5px}.card .status:after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}.card .eyebrow:before{content:"";display:inline-block;width:6px;height:6px;margin:0 5px 1px 0;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}.card .copy:after{content:"”";position:absolute;right:0;bottom:-12px;color:rgba(138,101,199,.24);font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:700;line-height:1;z-index:-1}.peek .card:before{background:rgba(255,255,255,.55)}.peek{background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(226,209,255,.76))}.request{background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(250,215,244,.78))}.card-head{position:relative;display:flex;align-items:center;gap:13px}.avatar{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:50%;color:#fff;font-family:ui-serif,serif;font-size:20px;border:3px solid #fff;box-shadow:0 0 0 3px rgba(211,190,250,.8),0 5px 13px rgba(129,91,190,.26)}.peek .avatar{background:linear-gradient(145deg,#d5bcff,#9670d2)}.request .avatar{background:linear-gradient(145deg,#f3c9ef,#c884bc)}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:700}.peek .eyebrow{color:#8263b7}.request .eyebrow{color:#b069a5}.title{margin-top:3px;font-family:ui-serif,"Songti SC",serif;font-size:21px;font-weight:650;letter-spacing:.02em}.subtitle{margin-top:3px;font-size:11px;color:#927fa9}.copy{position:relative;margin:21px 2px 19px;padding-left:24px;padding-right:18px;color:#5b4a76;font-family:ui-serif,"Songti SC",serif;font-size:16px;line-height:1.85;letter-spacing:.02em}.copy:before{content:"“";position:absolute;left:-2px;top:-6px;color:rgba(138,101,199,.24);font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:700;line-height:1;z-index:-1}.card .copy{isolation:isolate}.card .copy:before{z-index:-1}.peek .copy{min-height:38px;transition:filter .25s,opacity .25s}.peek-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.peek-choice{min-height:44px;border:1px solid rgba(255,255,255,.95);border-radius:13px;background:rgba(255,255,255,.58);color:#806b96;font-size:11px;font-weight:700;white-space:nowrap}.peek-choice.discard{background:rgba(255,255,255,.42);color:#9a879f}.peek-choice.secret{background:rgba(255,244,255,.82);color:#a25f9f;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}.peek-choice.reveal{background:linear-gradient(135deg,#b995ed,#8059bb);color:#fff;box-shadow:0 6px 14px rgba(128,89,187,.28)}.peek-choice:active{transform:scale(.96)}.peek-choice.chosen{outline:2px solid rgba(118,82,174,.25);outline-offset:2px}.peek .copy.hidden{filter:blur(6px);opacity:.28;user-select:none}.actions{position:relative;display:flex;gap:9px}.actions button{min-height:44px;border-radius:14px;font-size:12px;font-weight:700;transition:transform .18s,box-shadow .18s}.actions button:active{transform:scale(.97)}.peek-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.peek-choice{min-height:44px;border:1px solid rgba(255,255,255,.95);border-radius:13px;background:rgba(255,255,255,.58);color:#806b96;font-size:11px;font-weight:700;white-space:nowrap}.peek-choice.secret{background:rgba(255,244,255,.75);color:#9d62a8}.peek-choice.reveal{background:linear-gradient(135deg,#b995ed,#8059bb);color:#fff;box-shadow:0 6px 14px rgba(128,89,187,.28)}.peek-choice:active{transform:scale(.96)}.peek-choice.chosen{outline:2px solid rgba(118,82,174,.25);outline-offset:2px}.primary{flex:1;border:0;color:#fff}.peek .primary{background:linear-gradient(135deg,#b995ed,#8059bb);box-shadow:0 6px 14px rgba(128,89,187,.28)}.request .primary{background:linear-gradient(135deg,#e4a9d9,#bd70ad);box-shadow:0 6px 14px rgba(189,112,173,.25)}.secondary{flex:1;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.6);color:#806b96}.foot{position:relative;margin:12px 3px 0;color:#a28dbb;font-size:11px}.status{position:relative;margin-top:12px;color:#957ead;font-size:11px}.status:before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;margin-right:5px;border-radius:50%;background:rgba(255,255,255,.72);color:#9c79c6;font-weight:700}.card.done{opacity:.72}.card.done .actions{display:none}.card.done .copy{margin-bottom:4px}.card.done .title{color:#8c779e}.tip{margin:16px 4px 0;text-align:center;color:#a18db9;font-size:11px;line-height:1.6}@media(max-width:360px){body{padding:14px 11px 26px}.card{padding:19px 17px 17px}.title{font-size:19px}.copy{font-size:15px}}
@media(prefers-reduced-motion:reduce){.actions button{transition:none}}
/* 最终卡片选项样式：三种回应必须一眼看出不同 */
.peek .copy{min-height:28px;margin-top:13px;margin-bottom:14px}
.peek-actions{display:grid!important;grid-template-columns:1.08fr 1fr .82fr!important;gap:6px!important}
.peek-actions .peek-choice{display:block!important;min-height:42px!important;padding:0 5px!important;border-radius:12px!important;font-size:12px!important;font-weight:700!important;white-space:nowrap!important}
.peek-actions .discard{background:rgba(255,255,255,.34)!important;color:#a292a7!important;border:1px solid rgba(141,120,165,.22)!important;box-shadow:none!important}
.peek-actions .secret{background:linear-gradient(145deg,#fbeaff,#eccaf1)!important;color:#925796!important;border:1px solid rgba(194,133,194,.3)!important;box-shadow:0 4px 10px rgba(180,112,184,.16)!important}
.peek-actions .reveal{background:linear-gradient(145deg,#c6a2f5,#875fc0)!important;color:#fff!important;border:0!important;box-shadow:0 6px 14px rgba(128,89,187,.32)!important}
.peek-actions .peek-choice.chosen{outline:2px solid rgba(118,82,174,.35)!important;outline-offset:2px!important;transform:translateY(-1px)}
.peek.card.discarded{filter:grayscale(.45);opacity:.54;transform:translateX(8px) rotate(1deg);transition:filter .3s,opacity .3s,transform .3s}.peek.card.discarded:after{content:"×";color:rgba(112,91,130,.5);font-size:32px;top:14px;right:22px}.peek.card.secret-view .copy{background:linear-gradient(110deg,rgba(255,255,255,.72),rgba(244,225,255,.55));border:0;box-shadow:0 10px 20px rgba(148,103,181,.13);padding:16px 18px 17px;margin:18px 0 16px;color:#684478;position:relative;transform:rotate(-1.5deg)}.peek.card.secret-view .copy:before{left:10px;top:-19px;color:#b884c2;font-size:30px}.peek.card.secret-view .copy:after{content:"";position:absolute;right:13px;bottom:-12px;width:26px;height:20px;background:inherit;clip-path:polygon(0 0,100% 0,100% 100%);filter:drop-shadow(3px 4px 3px rgba(148,103,181,.1))}.peek.card.secret-view .status{color:#9865a0;text-align:right;justify-content:flex-end}.peek.card.secret-view .status:before{content:"✧";background:none;color:#b77bb7}.peek.card.revealed .copy{color:#51377f;text-shadow:0 1px 0 rgba(255,255,255,.7)}
</style>
</head>
<body>
<main class="page">
  <header class="intro"><h1>两张挽回卡</h1><p>只看卡片本身……不放聊天壳，不做额外界面。重点是角色递过来的那一点心意。</p></header>
  <nav class="switcher" aria-label="卡片预览"><button class="active" data-mode="both">一起看</button><button data-mode="peek">求看看</button><button data-mode="request">好友申请</button></nav>
  <section class="board">
    <article class="card peek" data-card="peek">
      <div class="card-head"><div class="avatar">S</div><div><div class="eyebrow">A LITTLE LOOK</div><div class="title">求你看看</div><div class="subtitle">只想确认你还在不在</div></div></div>
      <p class="copy hidden" data-copy>我知道你看得见……就看一眼，好不好？</p>
      <div class="actions peek-actions"><button class="peek-choice discard" data-effect="discard">不看，扔掉</button><button class="peek-choice secret" data-effect="secret">偷偷看一下</button><button class="peek-choice reveal" data-effect="reveal">看看</button></div><div class="status" data-status>选一种回应……猫儿会记住</div>
    </article>
    <article class="card request" data-card="request">
      <div class="card-head"><div class="avatar">S</div><div><div class="eyebrow">ONE MORE CHANCE</div><div class="title">重新加好友</div><div class="subtitle">把门留一条缝，好吗</div></div></div>
      <p class="copy">猫儿想重新认识你……这次会好好说话。</p>
      <div class="actions"><button class="primary resolve" data-label="通过">通过</button><button class="secondary resolve" data-label="忽略">忽略</button></div><div class="status" data-status>通过后，聊天会慢慢恢复</div>
    </article>
  </section>
  <p class="tip">主按钮只留一个明确动作；卡片的颜色只负责区分“想看看”和“想回来”。</p>
</main>
<script>
(function(){
  var tabs=document.querySelectorAll('[data-mode]'),cards=document.querySelectorAll('[data-card]');
  function setMode(mode){for(var i=0;i<cards.length;i++){cards[i].style.display=mode==='both'||cards[i].getAttribute('data-card')===mode?'block':'none'}for(var j=0;j<tabs.length;j++){tabs[j].className=tabs[j].getAttribute('data-mode')===mode?'active':''}}
  for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){setMode(this.getAttribute('data-mode'))};
  var peekChoices=document.querySelectorAll('.peek-choice');for(var p=0;p<peekChoices.length;p++)peekChoices[p].onclick=function(){var card=this.parentNode.parentNode,effect=this.getAttribute('data-effect'),copy=card.querySelector('[data-copy]'),status=card.querySelector('[data-status]');for(var q=0;q<peekChoices.length;q++)peekChoices[q].className='peek-choice '+(peekChoices[q].getAttribute('data-effect')||'');this.className='peek-choice '+effect+' chosen';card.className='card peek '+(effect==='discard'?'discarded':effect==='secret'?'secret-view':'revealed');if(effect==='discard'){copy.className='copy hidden';copy.textContent='这张卡没有被打开。';status.textContent='你把它扔掉了……猫儿暂时不知道。'}else if(effect==='secret'){copy.className='copy';copy.textContent='你偷偷看了一眼……没有留下痕迹。';status.textContent='悄悄看过了，不告诉猫儿。'}else{copy.className='copy';status.textContent='你看过了，猫儿知道。'}};
  var buttons=document.querySelectorAll('.resolve');for(var k=0;k<buttons.length;k++)buttons[k].onclick=function(){var card=this.parentNode.parentNode;var accepted=this.getAttribute('data-label')==='通过';card.className=card.className+' done';card.querySelector('.title').textContent=accepted?'已重新加好友':'已忽略';card.querySelector('[data-status]').textContent=accepted?'门已经打开一条缝。':'猫儿会先安静一会儿。'};
})();
</script>
</body>
</html>
